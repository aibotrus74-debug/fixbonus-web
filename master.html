<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixBonus — Панель мастера</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f6f8; color: #1a1a2e; padding: 16px; }
        .header { margin-bottom: 20px; }
        .workshop { font-size: 22px; font-weight: 700; }
        .master-name { font-size: 13px; color: #64748b; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { padding: 10px 18px; border-radius: 20px; background: white; color: #64748b; font-size: 14px; font-weight: 500; border: none; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .tab.active { background: #2563eb; color: white; }
        .btn-new { padding: 10px 18px; border-radius: 20px; background: #10b981; color: white; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-value.green { color: #10b981; }
        .stat-value.blue { color: #2563eb; }
        .stat-value.orange { color: #f59e0b; }
        .section { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .item-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .item-sub { font-size: 12px; color: #94a3b8; }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-amount { font-size: 16px; font-weight: 600; color: #10b981; }
        .item-amount.orange { color: #f59e0b; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge.closed { background: #d1fae5; color: #065f46; }
        .badge.work { background: #fef3c7; color: #92400e; }
        .btn-close { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .loader { text-align: center; padding: 40px; color: #64748b; }
        .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 16px; color: #991b1b; font-size: 14px; margin-bottom: 12px; }
        .empty { text-align: center; padding: 24px; color: #94a3b8; font-size: 14px; }
        .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
        .modal-bg.active { display: flex; }
        .modal { background: white; border-radius: 20px; padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal h3 { font-size: 20px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #2563eb; }
        .info-block { background: #f8fafc; border-radius: 12px; padding: 14px; margin-bottom: 14px; font-size: 14px; }
        .info-block b { color: #2563eb; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
        .btn-submit { background: #2563eb; color: white; }
        .client-search { position: relative; }
        .client-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 4px; max-height: 240px; overflow-y: auto; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.1); display: none; }
        .client-results.active { display: block; }
        .client-result { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .client-result:last-child { border-bottom: none; }
        .client-result:hover { background: #f8fafc; }
        .client-result-name { font-size: 14px; font-weight: 500; }
        .client-result-info { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .client-selected { background: #dbeafe; border: 1px solid #93c5fd; border-radius: 10px; padding: 12px; margin-top: 10px; }
        .client-selected-name { font-size: 15px; font-weight: 600; color: #1e40af; }
        .client-selected-info { font-size: 13px; color: #3b82f6; margin-top: 4px; }
        .client-selected-change { font-size: 12px; color: #2563eb; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }
        /* Блок подарка */
        .gift-block { background: linear-gradient(135deg,#10b981,#059669); color: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
        .gift-block h4 { font-size: 15px; margin-bottom: 8px; }
        .gift-block .amount { font-size: 24px; font-weight: 700; margin: 6px 0; }
        .gift-block .from { font-size: 12px; opacity: 0.9; }
        .gift-check { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; margin-top: 10px; cursor: pointer; }
        .gift-check input { width: 20px; height: 20px; cursor: pointer; }
        .gift-check label { font-size: 14px; font-weight: 600; cursor: pointer; }
        .gift-hint { font-size: 11px; opacity: 0.85; margin-top: 6px; }
    </style>
</head>
<body>
    <div id="app"><div class="loader">⏳ Загрузка...</div></div>

    <div class="modal-bg" id="closeModal"><div class="modal"><h3>🔒 Закрыть заявку</h3><div id="closeModalBody"></div></div></div>

    <div class="modal-bg" id="createModal">
        <div class="modal">
            <h3>➕ Новая заявка</h3>
            <div class="form-group">
                <label>Клиент (начните вводить имя, телефон или ID)</label>
                <div class="client-search">
                    <input type="text" id="clientQuery" placeholder="Например: Олеся, +7999..., 55348" autocomplete="off">
                    <div class="client-results" id="clientResults"></div>
                </div>
                <div id="selectedClient"></div>
            </div>
            <div class="form-group"><label>Устройство</label><input type="text" id="newDevice" placeholder="iPhone 12 Pro"></div>
            <div class="form-group"><label>Что делаем</label><textarea id="newWorks" rows="2" placeholder="Замена дисплея, чистка"></textarea></div>
            <div class="form-group"><label>Сумма с клиента, ₽</label><input type="number" id="newAmount" placeholder="6500"></div>
            <div class="form-group"><label>Расход на запчасти, ₽</label><input type="number" id="newParts" placeholder="0" value="0"></div>
            <div class="form-group"><label>Гарантия, дней</label><input type="number" id="newWarranty" placeholder="180" value="180"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateModal()">Отмена</button>
                <button class="btn-submit" onclick="submitCreate()">Создать</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = { API_URL: 'https://141.133.206.43.nip.io', MASTER_MAX_ID: parseInt(new URLSearchParams(window.location.search).get('uid')) || 100000001 };
        let currentTab = 'dashboard';
        let selectedClient = null;
        let searchTimeout = null;

        function init() { renderTabs(); loadTab('dashboard'); }

        function renderTabs() {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="workshop">🔧 FixPhone</div>
                    <div class="master-name">Панель мастера</div>
                </div>
                <div class="tabs">
                    <button class="tab ${currentTab==='dashboard'?'active':''}" onclick="switchTab('dashboard')">📊 Дашборд</button>
                    <button class="tab ${currentTab==='orders'?'active':''}" onclick="switchTab('orders')">📋 Заявки</button>
                    <button class="tab ${currentTab==='clients'?'active':''}" onclick="switchTab('clients')">👥 Клиенты</button>
                    <button class="tab ${currentTab==='settings'?'active':''}" onclick="switchTab('settings')">⚙️ Настройки</button>
                    <button class="btn-new" onclick="openCreateModal()">+ Новая заявка</button>
                </div>
                <div id="content"><div class="loader">⏳ Загрузка...</div></div>
            `;
        }

        function switchTab(tab) { currentTab = tab; renderTabs(); loadTab(tab); }

        async function loadTab(tab) {
            try {
                let url;
                if (tab === 'dashboard') url = `${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/dashboard`;
                if (tab === 'orders') url = `${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/orders`;
                if (tab === 'clients') url = `${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/clients`;
                if (tab === 'settings') url = `${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/settings`;
                const r = await fetch(url);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                if (tab === 'dashboard') renderDashboard(data);
                if (tab === 'orders') renderOrders(data);
                if (tab === 'clients') renderClients(data);
                if (tab === 'settings') renderSettings(data);
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="error-box">❌ ${err.message}</div>`;
            }
        }

        function renderDashboard(data) {
            const s = data.stats;
            const orders = data.recent_orders.map(o => `
                <div style="padding:12px 0; border-bottom:1px solid #f1f5f9;">
                    <div class="item-row">
                        <div><div class="item-title">№${o.id} — ${o.device}</div><div class="item-sub">${o.client_name} • ${o.date||''}</div></div>
                        <div class="item-amount">${fmt(o.final)}</div>
                    </div>
                </div>`).join('');
            document.getElementById('content').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">💵 Выручка</div><div class="stat-value blue">${fmt(s.revenue)}</div></div>
                    <div class="stat-card"><div class="stat-label">✅ Чистыми</div><div class="stat-value green">${fmt(s.net_profit)}</div></div>
                    <div class="stat-card"><div class="stat-label">📦 Запчасти</div><div class="stat-value orange">${fmt(s.parts)}</div></div>
                    <div class="stat-card"><div class="stat-label">🎁 Скидка</div><div class="stat-value orange">${fmt(s.discount)}</div></div>
                    <div class="stat-card"><div class="stat-label">📊 Заявок</div><div class="stat-value">${s.orders_count}</div></div>
                    <div class="stat-card"><div class="stat-label">👥 Клиентов</div><div class="stat-value">${s.clients_count}</div></div>
                    <div class="stat-card"><div class="stat-label">📈 Ср. чек</div><div class="stat-value">${fmt(s.avg_check)}</div></div>
                    <div class="stat-card"><div class="stat-label">💎 На руки</div><div class="stat-value green">${fmt(s.net_after_tax)}</div></div>
                </div>
                <div class="section"><div class="section-title">🕐 Последние заявки</div>${orders||'<div class="empty">Пока нет заявок</div>'}</div>`;
        }

        function renderOrders(data) {
            const html = data.orders.map(o => {
                const isWork = o.status !== 'closed';
                return `<div class="section">
                    <div class="item-row">
                        <div><div class="item-title">№${o.id} — ${o.device}</div><div class="item-sub">${o.client_name} (ID ${o.client_code}) • ${o.created_at||''}</div></div>
                        <span class="badge ${isWork?'work':'closed'}">${isWork?'В работе':'Закрыт'}</span>
                    </div>
                    <div style="margin-top:8px; font-size:13px; color:#64748b;">${o.works||''}</div>
                    <div class="item-row" style="margin-top:8px;">
                        <div class="item-sub">К оплате: <b>${fmt(o.final)}</b></div>
                        <div class="item-amount">Чистыми ${fmt(o.net)}</div>
                    </div>
                    ${o.warranty_until?`<div class="item-sub" style="margin-top:6px;">🛡 Гарантия до ${o.warranty_until}</div>`:''}
                    ${isWork?`<button class="btn-close" style="margin-top:10px;" onclick='openCloseModal(${JSON.stringify(o)})'>🔒 Закрыть заявку</button>`:''}
                </div>`;
            }).join('');
            document.getElementById('content').innerHTML = html||'<div class="empty">Пока нет заявок</div>';
        }

        function renderClients(data) {
            const html = data.clients.map(c => `
                <div class="section">
                    <div class="item-row">
                        <div>
                            <div class="item-title">👤 ${c.name}</div>
                            <div class="item-sub">ID: <b>${c.referral_code||'—'}</b> • 📞 ${c.phone||'—'}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="item-amount orange">${fmt(c.bonus_balance)}</div>
                            <div class="item-sub">бонусов</div>
                        </div>
                    </div>
                    <div class="item-sub" style="margin-top:8px;">${c.orders_count} ремонтов • всего ${fmt(c.total_paid)}</div>
                </div>`).join('');
            document.getElementById('content').innerHTML = html||'<div class="empty">Пока нет клиентов</div>';
        }

        function renderSettings(s) {
            document.getElementById('content').innerHTML = `
                <div class="section">
                    <div class="section-title">⚙️ Настройки бонусной программы</div>
                    <div class="form-group"><label>% начисления за ремонт — диапазон (мин / макс)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="number" id="s_rate_min" value="${s.bonus_rate_min}" min="0" max="100">
                            <input type="number" id="s_rate_max" value="${s.bonus_rate_max}" min="0" max="100">
                        </div>
                    </div>
                    <div class="form-group"><label>% начисления по умолчанию</label><input type="number" id="s_rate_def" value="${s.bonus_rate_default}" min="0" max="100"></div>
                    <div class="form-group"><label>Максимум списания бонусами от чека, % (не более 30)</label><input type="number" id="s_max_spend" value="${s.bonus_max_spend_percent}" min="0" max="30"></div>
                    <div class="form-group"><label>Срок жизни бонусов, месяцев</label><input type="number" id="s_lifetime" value="${s.bonus_lifetime_months}" min="1" max="60"></div>
                    <div class="form-group"><label>Бонус на день рождения, ₽</label><input type="number" id="s_bday" value="${s.birthday_bonus}"></div>
                    <div class="form-group"><label>Бонус за отзыв с фото, ₽</label><input type="number" id="s_review" value="${s.review_bonus}"></div>
                    <div class="form-group"><label>Бонус за заполнение профиля, ₽</label><input type="number" id="s_profile" value="${s.profile_bonus}"></div>
                    <div class="form-group"><label>Доля дарителю при реферале, %</label><input type="number" id="s_ref" value="${s.referral_split_percent}" min="0" max="100"></div>
                    <div class="form-group"><label>Налог, %</label><input type="number" id="s_tax" value="${s.tax_rate}" min="0" max="30"></div>
                    <div class="form-group" style="display:flex; gap:20px; flex-wrap:wrap;">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="s_enable_ref" ${s.enable_referral?'checked':''} style="width:auto;"> Реферальная программа</label>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="s_enable_gifts" ${s.enable_gifts?'checked':''} style="width:auto;"> Подарки бонусов</label>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="s_enable_exp" ${s.enable_expiration?'checked':''} style="width:auto;"> Сгорание бонусов</label>
                    </div>
                    <div class="modal-actions" style="margin-top:20px;"><button class="btn-submit" onclick="saveSettings()">💾 Сохранить настройки</button></div>
                </div>`;
        }

        async function saveSettings() {
            const payload = {
                bonus_rate_min: parseFloat(document.getElementById('s_rate_min').value)||10,
                bonus_rate_max: parseFloat(document.getElementById('s_rate_max').value)||30,
                bonus_rate_default: parseFloat(document.getElementById('s_rate_def').value)||25,
                bonus_max_spend_percent: Math.min(parseFloat(document.getElementById('s_max_spend').value)||30, 30),
                bonus_lifetime_months: parseInt(document.getElementById('s_lifetime').value)||12,
                birthday_bonus: parseFloat(document.getElementById('s_bday').value)||1000,
                review_bonus: parseFloat(document.getElementById('s_review').value)||300,
                profile_bonus: parseFloat(document.getElementById('s_profile').value)||100,
                referral_split_percent: parseFloat(document.getElementById('s_ref').value)||50,
                tax_rate: parseFloat(document.getElementById('s_tax').value)||6,
                enable_referral: document.getElementById('s_enable_ref').checked,
                enable_gifts: document.getElementById('s_enable_gifts').checked,
                enable_expiration: document.getElementById('s_enable_exp').checked
            };
            try {
                const r = await fetch(`${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/settings`, {
                    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
                });
                if (!r.ok) throw new Error('Ошибка сохранения');
                alert('✅ Настройки сохранены!');
            } catch (err) { alert('❌ ' + err.message); }
        }

        document.addEventListener('input', function(e) {
            if (e.target && e.target.id === 'clientQuery') {
                clearTimeout(searchTimeout);
                const q = e.target.value.trim();
                searchTimeout = setTimeout(() => searchClients(q), 300);
            }
        });

        async function searchClients(q) {
            try {
                const r = await fetch(`${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/clients/search?q=${encodeURIComponent(q)}`);
                const data = await r.json();
                const box = document.getElementById('clientResults');
                if (!data.clients || data.clients.length === 0) {
                    box.innerHTML = '<div class="client-result"><div class="client-result-info">Ничего не найдено</div></div>';
                } else {
                    box.innerHTML = data.clients.map(c => `
                        <div class="client-result" onclick='pickClient(${JSON.stringify(c)})'>
                            <div class="client-result-name">${c.name}</div>
                            <div class="client-result-info">ID ${c.referral_code} • ${c.phone||'—'} • ${fmt(c.bonus_balance)}</div>
                        </div>`).join('');
                }
                box.classList.add('active');
            } catch (err) { console.error(err); }
        }

        function pickClient(c) {
            selectedClient = c;
            document.getElementById('clientQuery').value = '';
            document.getElementById('clientResults').classList.remove('active');
            document.getElementById('selectedClient').innerHTML = `
                <div class="client-selected">
                    <div class="client-selected-name">👤 ${c.name}</div>
                    <div class="client-selected-info">ID: ${c.referral_code} • 📞 ${c.phone||'—'} • 💎 ${fmt(c.bonus_balance)}</div>
                    <span class="client-selected-change" onclick="clearClient()">Изменить</span>
                </div>`;
        }

        function clearClient() { selectedClient = null; document.getElementById('selectedClient').innerHTML = ''; }

        // === ЗАКРЫТИЕ ЗАЯВКИ С АВТО-ПОДАРКОМ ===
        async function openCloseModal(order) {
            document.getElementById('closeModalBody').innerHTML = '<div class="loader">⏳ Загрузка...</div>';
            document.getElementById('closeModal').classList.add('active');

            // Получаем данные клиента и активный подарок
            let client = { bonus_balance: 0 };
            let gift = null;
            try {
                const r = await fetch(`${CONFIG.API_URL}/api/client/by-code/${order.client_code}/active-gift`);
                if (r.ok) {
                    const data = await r.json();
                    client = data.client || client;
                    gift = data.gift || null;
                }
            } catch (e) { console.warn(e); }

            const maxSpend = Math.round(order.amount * 0.30);

            const giftHtml = gift ? `
                <div class="gift-block">
                    <h4>🎁 У клиента есть подарок</h4>
                    <div class="amount">${fmt(gift.amount)}</div>
                    <div class="from">От: <b>${gift.giver_name}</b> (ID ${gift.giver_code})</div>
                    <div class="from gift-hint">Подарок был принят ${gift.created_at || ''}</div>
                    <div class="gift-check">
                        <input type="checkbox" id="applyGift" checked>
                        <label for="applyGift">Применить подарок к этому ремонту</label>
                    </div>
                    <div class="gift-hint">Если сумма превышает лимит списания — она автоматически уменьшится</div>
                </div>
            ` : '';

            document.getElementById('closeModalBody').innerHTML = `
                <div class="info-block">
                    <div><b>Заявка №${order.id}</b> — ${order.device}</div>
                    <div style="margin-top:6px;">Клиент: <b>${order.client_name}</b> (ID ${order.client_code})</div>
                    <div style="margin-top:6px;">Баланс клиента: <b>${fmt(client.bonus_balance)}</b></div>
                    <div style="margin-top:6px;">Сумма чека: <b>${fmt(order.amount)}</b></div>
                    <div style="margin-top:6px; color:#64748b; font-size:12px;">Максимум списания: 30% = ${fmt(maxSpend)}</div>
                </div>
                ${giftHtml}
                <div class="form-group">
                    <label>Списать бонусов с клиента, ₽</label>
                    <input type="number" id="closeBonusSpend" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>% начисления бонусов (по умолчанию — из настроек)</label>
                    <input type="number" id="closeBonusRate" placeholder="Оставьте пустым для значения по умолчанию" min="0" max="100">
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeCloseModal()">Отмена</button>
                    <button class="btn-submit" onclick="submitClose(${order.id})">🔒 Закрыть заявку</button>
                </div>
            `;
        }

        function closeCloseModal() { document.getElementById('closeModal').classList.remove('active'); }

        async function submitClose(orderId) {
            const rateVal = document.getElementById('closeBonusRate').value.trim();
            const clientSpend = parseFloat(document.getElementById('closeBonusSpend').value) || 0;

            let giverCode = null;
            let giverSpend = 0;

            // Если есть галочка "применить подарок"
            const giftCheckbox = document.getElementById('applyGift');
            if (giftCheckbox && giftCheckbox.checked) {
                // Получаем данные подарка снова (проще — из DOM)
                const giftBlock = document.querySelector('.gift-block');
                if (giftBlock) {
                    // Вытаскиваем код дарителя из текста (ID xxx)
                    const match = giftBlock.textContent.match(/ID (\d+)/);
                    if (match) giverCode = match[1];
                    // Сумма подарка — из заголовка `.amount`
                    const amountEl = giftBlock.querySelector('.amount');
                    if (amountEl) {
                        giverSpend = parseFloat(amountEl.textContent.replace(/[^\d]/g, '')) || 0;
                    }
                }
            }

            const payload = {
                client_bonus_to_spend: clientSpend,
                giver_referral_code: giverCode,
                giver_bonus_to_spend: giverSpend,
                bonus_rate: rateVal ? parseFloat(rateVal) : null
            };
            try {
                const r = await fetch(`${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/orders/${orderId}/close`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || 'Ошибка');
                alert(`✅ Заявка закрыта!\n\nК оплате: ${fmt(data.final_amount)}\nЧистыми: ${fmt(data.net_profit)}\nНачислено клиенту: ${fmt(data.bonus_earned_client)}\nНачислено дарителю: ${fmt(data.bonus_earned_giver)}`);
                closeCloseModal();
                switchTab('orders');
            } catch (err) { alert('❌ ' + err.message); }
        }

        function openCreateModal() {
            selectedClient = null;
            document.getElementById('selectedClient').innerHTML = '';
            document.getElementById('clientQuery').value = '';
            document.getElementById('createModal').classList.add('active');
        }
        function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }

        async function submitCreate() {
            if (!selectedClient) { alert('Выберите клиента'); return; }
            const payload = {
                client_referral_code: selectedClient.referral_code,
                device_model: document.getElementById('newDevice').value.trim(),
                works_description: document.getElementById('newWorks').value.trim(),
                client_amount: parseFloat(document.getElementById('newAmount').value) || 0,
                parts_cost: parseFloat(document.getElementById('newParts').value) || 0,
                ads_cost: 0,
                warranty_days: parseInt(document.getElementById('newWarranty').value) || 0
            };
            if (!payload.client_amount) { alert('Введите сумму'); return; }
            try {
                const r = await fetch(`${CONFIG.API_URL}/api/master/${CONFIG.MASTER_MAX_ID}/orders/create`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || 'Ошибка');
                alert(`✅ Заявка №${data.order_id} создана!`);
                closeCreateModal();
                switchTab('orders');
            } catch (err) { alert('❌ ' + err.message); }
        }

        function fmt(v) { return Number(v||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0}) + ' ₽'; }

        window.addEventListener('load', init);
        if (document.readyState === 'complete') init();
    </script>
</body>
</html>
