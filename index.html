<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FixBonus — Мой кошелёк</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f6f8; color: #1a1a2e; padding: 16px; min-height: 100vh; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: 600; }
        .user-name { font-size: 18px; font-weight: 600; }
        .user-platform { font-size: 13px; color: #64748b; }
        .balance-card { background: linear-gradient(135deg, #f59e0b, #fbbf24); border-radius: 20px; padding: 24px; color: white; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3); }
        .balance-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .balance-amount { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
        .balance-sub { font-size: 13px; opacity: 0.85; margin-top: 8px; }
        .my-id-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
        .my-id-label { font-size: 13px; color: #64748b; margin-bottom: 8px; }
        .my-id-value { font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #2563eb; font-variant-numeric: tabular-nums; }
        .my-id-hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .lots-section { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .lot-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .lot-item:last-child { border-bottom: none; }
        .lot-reason { font-size: 14px; margin-bottom: 4px; }
        .lot-expires { font-size: 12px; color: #94a3b8; }
        .lot-amount { font-size: 18px; font-weight: 600; color: #10b981; }
        .empty-state { text-align: center; padding: 24px; color: #94a3b8; font-size: 14px; }
        .loader { text-align: center; padding: 40px; color: #64748b; }
        .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 16px; color: #991b1b; font-size: 14px; margin-bottom: 16px; }
        .not-found-box { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 12px; padding: 20px; text-align: center; }
        .not-found-box h3 { color: #92400e; margin-bottom: 12px; font-size: 18px; }
        .max-id-big { font-size: 28px; font-weight: 700; color: #92400e; margin: 16px 0; letter-spacing: 2px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loader">⏳ Загружаем данные из MAX...</div>
    </div>

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ
        // ============================================================
        const CONFIG = {
            API_URL: 'https://141.133.206.43.nip.io'
        };

        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ MAX BRIDGE
        // ============================================================
        function initMaxApp() {
            if (typeof window.WebApp === 'undefined') {
                showError('MAX Bridge не загрузился. Откройте через чат-бота в MAX.');
                return;
            }

            window.WebApp.ready();

            const initData = window.WebApp.initDataUnsafe;
            console.log('📦 Данные из MAX:', initData);

            const user = initData && initData.user ? initData.user : null;
            const platform = window.WebApp.platform || 'unknown';
            const version = window.WebApp.version || '?';

            const displayData = {
                max_user_id: user ? user.id : null,
                first_name: user ? user.first_name : 'Гость',
                last_name: user ? user.last_name : '',
                platform: platform,
                version: version
            };

            console.log('👤 Пользователь:', displayData);

            if (!displayData.max_user_id) {
                showError('Не удалось получить ваш MAX ID. Откройте через чат-бота.');
                return;
            }

            loadClient(displayData);
        }

        // ============================================================
        // 2. ЗАГРУЗКА ДАННЫХ КЛИЕНТА С БЭКЕНДА
        // ============================================================
        async function loadClient(displayData) {
            try {
                const url = `${CONFIG.API_URL}/api/client/${displayData.max_user_id}`;
                console.log('🌐 Запрос к:', url);

                const response = await fetch(url);
                console.log('📡 Ответ:', response.status);

                if (response.status === 404) {
                    // Клиент не найден — показываем MAX ID
                    renderNotFound(displayData);
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Данные:', data);
                renderWallet(displayData, data);

            } catch (err) {
                console.error('❌ Ошибка:', err);
                showError('Не удалось загрузить данные: ' + err.message);
            }
        }

        // ============================================================
        // 3. ОТРИСОВКА КОШЕЛЬКА
        // ============================================================
        function renderWallet(displayData, data) {
            const fullName = data.name || [displayData.first_name, displayData.last_name].filter(Boolean).join(' ');
            const avatarLetter = (data.name || displayData.first_name || '?')[0].toUpperCase();

            let lotsHtml = '';
            if (data.lots && data.lots.length > 0) {
                lotsHtml = data.lots.map(lot => `
                    <div class="lot-item">
                        <div>
                            <div class="lot-reason">${lot.reason}</div>
                            <div class="lot-expires">Сгорят: ${lot.expires_at}</div>
                        </div>
                        <div class="lot-amount">${formatMoney(lot.remaining)}</div>
                    </div>
                `).join('');
            } else {
                lotsHtml = '<div class="empty-state">Пока нет активных бонусов</div>';
            }

            const html = `
                <div class="header">
                    <div class="avatar">${avatarLetter}</div>
                    <div>
                        <div class="user-name">${fullName}</div>
                        <div class="user-platform">${displayData.platform} • MAX ID: ${displayData.max_user_id}</div>
                    </div>
                </div>

                <div class="balance-card">
                    <div class="balance-label">💎 МОИ БОНУСЫ</div>
                    <div class="balance-amount">${formatMoney(data.bonus_balance)}</div>
                    <div class="balance-sub">1 бонус = 1 рубль</div>
                </div>

                <div class="my-id-card">
                    <div class="my-id-label">МОЙ ID ДЛЯ МАСТЕРА</div>
                    <div class="my-id-value">${formatId(data.referral_code)}</div>
                    <div class="my-id-hint">Покажите мастеру для списания бонусов</div>
                </div>

                <div class="lots-section">
                    <div class="section-title">📊 Активные партии бонусов</div>
                    ${lotsHtml}
                </div>

                <div style="text-align:center; margin-top:20px; color:#94a3b8; font-size:12px;">
                    Мастер: ${data.master.full_name || '—'}<br>
                    ИНН: ${data.master.inn || '—'} • ${data.master.workshop || '—'}
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        // ============================================================
        // 4. КЛИЕНТ НЕ НАЙДЕН — показываем MAX ID
        // ============================================================
        function renderNotFound(displayData) {
            const html = `
                <div class="header">
                    <div class="avatar">?</div>
                    <div>
                        <div class="user-name">${displayData.first_name || 'Гость'}</div>
                        <div class="user-platform">${displayData.platform}</div>
                    </div>
                </div>

                <div class="not-found-box">
                    <h3>🔍 Вас нет в базе мастера</h3>
                    <p style="color:#92400e; font-size:14px;">
                        Передайте мастеру ваш MAX ID, чтобы он добавил вас:
                    </p>
                    <div class="max-id-big">${displayData.max_user_id}</div>
                    <p style="color:#92400e; font-size:12px; margin-top:12px;">
                        После добавления закройте и откройте приложение заново
                    </p>
                </div>

                <div style="text-align:center; margin-top:24px;">
                    <button onclick="location.reload()" style="background:#2563eb; color:white; border:none; padding:14px 28px; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer;">
                        🔄 Обновить
                    </button>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function formatMoney(amount) {
            if (amount === null || amount === undefined) return '0 ₽';
            return Number(amount).toLocaleString('ru-RU', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }) + ' ₽';
        }

        function formatId(code) {
            if (!code) return '—';
            return String(code).split('').join(' ');
        }

        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error-box">❌ ${message}</div>
                <div style="text-align:center; margin-top:16px;">
                    <button onclick="location.reload()" style="background:#2563eb; color:white; border:none; padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;">
                        🔄 Попробовать снова
                    </button>
                </div>
            `;
        }

        window.addEventListener('load', initMaxApp);
        if (document.readyState === 'complete') initMaxApp();
    </script>
</body>
</html>
