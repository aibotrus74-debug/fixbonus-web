<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FixBonus — Мой кошелёк</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        body { background:#f4f6f8; color:#1a1a2e; padding:16px; padding-bottom:90px; min-height:100vh; }
        .tab-bar { position:fixed; bottom:0; left:0; right:0; background:white; display:flex; justify-content:space-around; padding:8px 0; box-shadow:0 -2px 12px rgba(0,0,0,0.08); border-top:1px solid #e2e8f0; z-index:50; }
        .tab-btn { flex:1; background:none; border:none; padding:8px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; color:#64748b; font-size:11px; }
        .tab-btn.active { color:#2563eb; }
        .tab-btn .ico { font-size:22px; }
        .header { margin-bottom:20px; }
        .avatar { width:48px; height:48px; border-radius:50%; background:#2563eb; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; font-weight:600; }
        .user-name { font-size:18px; font-weight:600; }
        .user-sub { font-size:12px; color:#64748b; margin-top:2px; }
        .card { background:white; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .balance-card { background:linear-gradient(135deg,#f59e0b,#fbbf24); color:white; padding:24px; border-radius:20px; margin-bottom:16px; box-shadow:0 4px 16px rgba(245,158,11,0.3); }
        .balance-label { font-size:13px; opacity:0.9; margin-bottom:6px; }
        .balance-amount { font-size:40px; font-weight:700; letter-spacing:-1px; }
        .balance-sub { font-size:12px; opacity:0.85; margin-top:6px; }
        .id-card { background:white; border-radius:16px; padding:20px; text-align:center; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .id-label { font-size:12px; color:#64748b; margin-bottom:8px; }
        .id-value { font-size:32px; font-weight:700; letter-spacing:8px; color:#2563eb; }
        .id-hint { font-size:11px; color:#94a3b8; margin-top:6px; }
        .section-title { font-size:16px; font-weight:600; margin-bottom:12px; }
        .lot { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f1f5f9; }
        .lot:last-child { border-bottom:none; }
        .lot-reason { font-size:14px; margin-bottom:4px; }
        .lot-exp { font-size:12px; color:#94a3b8; }
        .lot-amount { font-size:18px; font-weight:600; color:#10b981; }
        .empty { text-align:center; padding:24px; color:#94a3b8; font-size:14px; }
        .loader { text-align:center; padding:40px; color:#64748b; }
        .error-box { background:#fef2f2; border:1px solid #fecaca; border-radius:12px; padding:16px; color:#991b1b; font-size:14px; }
        .rule-block { background:#f8fafc; border-radius:12px; padding:14px; margin-bottom:10px; font-size:14px; line-height:1.5; }
        .rule-block b { color:#2563eb; }
        .rule-num { display:inline-block; width:24px; height:24px; border-radius:50%; background:#2563eb; color:white; text-align:center; line-height:24px; font-size:12px; font-weight:600; margin-right:8px; }
        .order-card { border-left:3px solid #10b981; padding-left:14px; }
        .order-device { font-size:15px; font-weight:600; }
        .order-works { font-size:13px; color:#64748b; margin-top:4px; }
        .order-row { display:flex; justify-content:space-between; margin-top:8px; font-size:13px; }
        .order-amount { font-weight:600; color:#10b981; }
        .warranty-badge { display:inline-block; background:#fef3c7; color:#92400e; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; margin-top:6px; }
        .warranty-ok { background:#d1fae5; color:#065f46; }
        .btn-primary { width:100%; padding:16px; border-radius:14px; background:#2563eb; color:white; border:none; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; }
        .btn-gift { width:100%; padding:16px; border-radius:14px; background:#10b981; color:white; border:none; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; }
        .amount-input { width:100%; padding:16px; border:2px solid #e2e8f0; border-radius:14px; font-size:24px; font-weight:600; text-align:center; color:#2563eb; margin-bottom:12px; }
        .amount-input:focus { outline:none; border-color:#2563eb; }
        .quick-btns { display:flex; gap:8px; margin-bottom:14px; }
        .quick-btn { flex:1; padding:10px; border-radius:10px; background:#f1f5f9; border:none; font-size:14px; font-weight:600; cursor:pointer; color:#2563eb; }
        .master-card { background:white; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); font-size:13px; }
        .master-card b { color:#2563eb; }
        .gift-banner { background:linear-gradient(135deg,#10b981,#059669); color:white; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 4px 16px rgba(16,185,129,0.3); }
        .gift-banner h3 { font-size:16px; margin-bottom:8px; }
        .gift-banner .amount { font-size:32px; font-weight:700; margin:8px 0; }
        .gift-banner .from { font-size:13px; opacity:0.9; }
        .modal-bg { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center; padding:16px; }
        .modal-bg.active { display:flex; }
        .modal { background:white; border-radius:20px; padding:20px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto; }
        .modal h3 { font-size:18px; margin-bottom:14px; }
        .share-text { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:14px; font-size:13px; line-height:1.6; white-space:pre-wrap; max-height:280px; overflow-y:auto; margin-bottom:14px; }
        .modal-actions { display:flex; flex-direction:column; gap:8px; }
        .modal-btn { padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
        .btn-share { background:#10b981; color:white; }
        .btn-copy { background:#2563eb; color:white; }
        .btn-close { background:#f1f5f9; color:#64748b; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:14px 20px; border-radius:12px; color:white; font-size:14px; font-weight:500; z-index:1000; box-shadow:0 4px 20px rgba(0,0,0,0.25); max-width:90%; text-align:center; animation:slideDown 0.3s ease; }
        .toast-success { background:#10b981; }
        .toast-error { background:#ef4444; }
        .toast-info { background:#2563eb; }
        @keyframes slideDown { from { opacity:0; transform:translate(-50%,-20px); } to { opacity:1; transform:translate(-50%,0); } }
    </style>
</head>
<body>
    <div id="app"><div class="loader">⏳ Загрузка...</div></div>
    <div id="tabbar"></div>

    <div class="modal-bg" id="inviteModal">
        <div class="modal">
            <h3>🎁 Приглашение готово!</h3>
            <p style="font-size:13px; color:#64748b; margin-bottom:12px;">Отправьте другу любым удобным способом:</p>
            <div class="share-text" id="inviteText"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-share" onclick="tryNativeShare()">📤 Поделиться в приложении</button>
                <button class="modal-btn btn-copy" onclick="copyInvite()">📋 Скопировать текст</button>
                <button class="modal-btn btn-close" onclick="closeInviteModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://141.133.206.43.nip.io';
        let maxUserId = null;
        let userData = null;
        let currentTab = 'wallet';
        let lastInviteText = '';
        let pendingGift = null;

        function showToast(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2500);
            setTimeout(() => el.remove(), 3000);
        }

        async function init() {
            if (typeof window.WebApp === 'undefined') {
                showError('Откройте через чат-бота в MAX');
                return;
            }
            window.WebApp.ready();

            // ===== ПРИЁМ ПРИГЛАШЕНИЯ — читаем из всех возможных мест =====
            let inviteToken = null;

            // 1. Из MAX Bridge (самый главный источник!)
            try {
                const maxData = window.WebApp.initDataUnsafe;
                console.log('📦 initDataUnsafe:', JSON.stringify(maxData));
                if (maxData) {
                    // start_param — официальный параметр MAX
                    if (maxData.start_param) {
                        inviteToken = maxData.start_param;
                        console.log('✅ start_param найден:', inviteToken);
                    }
                    // startParam — на всякий случай
                    if (!inviteToken && maxData.startParam) {
                        inviteToken = maxData.startParam;
                    }
                }
            } catch (e) {
                console.warn('initDataUnsafe error:', e);
            }

            // 2. Из URL (fallback)
            if (!inviteToken) {
                const urlParams = new URLSearchParams(window.location.search);
                inviteToken = urlParams.get('invite') || urlParams.get('startapp') || urlParams.get('start_param');
                if (inviteToken) console.log('✅ Токен из URL:', inviteToken);
            }

            // Чистим префикс invite_
            if (inviteToken && inviteToken.startsWith('invite_')) {
                inviteToken = inviteToken.replace('invite_', '');
            }

            console.log('🔗 Финальный токен:', inviteToken);

            // Данные пользователя
            const u = window.WebApp.initDataUnsafe?.user;
            if (!u) { showError('Не удалось получить MAX ID'); return; }
            maxUserId = u.id;
            console.log('👤 Пользователь:', u.id, u.first_name);

            // Отправляем приглашение на бэкенд
            if (inviteToken) {
                console.log('📨 Отправляем приглашение на сервер...');
                try {
                    const r = await fetch(`${API}/api/client/${maxUserId}/accept-invitation`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            token: inviteToken,
                            name: [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Новый клиент'
                        })
                    });
                    const data = await r.json();
                    console.log('📥 Ответ сервера:', r.status, data);
                    if (r.ok) {
                        showToast(`🎁 Вам подарили ${Math.round(data.amount)} ₽ от ${data.giver_name}!`, 'success');
                    }
                } catch (e) {
                    console.error('Ошибка принятия приглашения:', e);
                }
            }

            // Загружаем данные клиента
            try {
                const r = await fetch(`${API}/api/client/${maxUserId}/full`);
                if (r.status === 404) { renderNotFound(u); return; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                userData = await r.json();

                // Загружаем подарок
                try {
                    const gr = await fetch(`${API}/api/client/${maxUserId}/pending-gift`);
                    if (gr.ok) {
                        const gd = await gr.json();
                        pendingGift = gd.gift;
                        console.log('🎁 Подарок:', pendingGift);
                    }
                } catch (e) { console.warn('gift load:', e); }

                renderTab();
            } catch (err) {
                showError('Ошибка загрузки: ' + err.message);
            }
        }

        function renderTabBar() {
            const tabs = [
                { id: 'wallet', ico: '💎', label: 'Кошелёк' },
                { id: 'rules', ico: '📘', label: 'Правила' },
                { id: 'orders', ico: '🔧', label: 'Ремонты' },
                { id: 'share', ico: '🎁', label: 'Поделиться' }
            ];
            document.getElementById('tabbar').innerHTML = `<div class="tab-bar">${tabs.map(t =>
                `<button class="tab-btn ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">
                    <span class="ico">${t.ico}</span>${t.label}
                </button>`).join('')}</div>`;
        }

        function switchTab(tab) { currentTab = tab; renderTab(); window.scrollTo(0,0); }
        function renderTab() {
            renderTabBar();
            if (currentTab === 'wallet') renderWallet();
            if (currentTab === 'rules') renderRules();
            if (currentTab === 'orders') renderOrders();
            if (currentTab === 'share') renderShare();
        }

        function renderWallet() {
            const c = userData.client, m = userData.master, lots = userData.lots;
            const lotsHtml = lots.length ? lots.map(l => `
                <div class="lot">
                    <div><div class="lot-reason">${l.reason}</div><div class="lot-exp">Сгорят: ${l.expires_at}</div></div>
                    <div class="lot-amount">${fmt(l.remaining)}</div>
                </div>`).join('') : '<div class="empty">Пока нет активных бонусов</div>';

const giftHtml = pendingGift ? `
    <div class="gift-banner">
        <h3>🎁 Вам подарили скидку!</h3>
        <div class="amount">${fmt(pendingGift.amount)}</div>
        <div class="from">От: <b>${pendingGift.giver_name}</b> (ID ${pendingGift.giver_code})</div>
        <div class="from" style="margin-top:12px; font-size:13px; background:rgba(255,255,255,0.15); padding:10px; border-radius:10px;">
            💡 <b>Как использовать:</b><br>
            Просто вызовите мастера.<br>
            При закрытии заявки мастер применит подарок — и вы заплатите на ${fmt(pendingGift.amount)} меньше.
        </div>
        <div class="from" style="margin-top:8px; font-size:11px; opacity:0.75;">
            Подарок применится автоматически при следующем ремонте
        </div>
    </div>
` : '';

            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="avatar">${c.name[0]}</div>
                    <div class="user-name">${c.name}</div>
                    <div class="user-sub">MAX ID: ${maxUserId}</div>
                </div>
                ${giftHtml}
                <div class="balance-card">
                    <div class="balance-label">💎 МОИ БОНУСЫ</div>
                    <div class="balance-amount">${fmt(c.bonus_balance)}</div>
                    <div class="balance-sub">1 бонус = 1 рубль</div>
                </div>
                <div class="id-card">
                    <div class="id-label">МОЙ ID ДЛЯ МАСТЕРА</div>
                    <div class="id-value">${c.referral_code.split('').join(' ')}</div>
                    <div class="id-hint">Покажите этот ID мастеру для списания бонусов</div>
                </div>
                <div class="card">
                    <div class="section-title">📊 Активные партии бонусов</div>
                    ${lotsHtml}
                </div>
                <div class="master-card">
                    <div>👨‍🔧 Ваш мастер: <b>${m.full_name}</b></div>
                    <div style="margin-top:4px;">🏢 ${m.workshop}</div>
                    <div style="margin-top:4px;">📞 ${m.phone}</div>
                    <div style="margin-top:4px;">ИНН: ${m.inn}</div>
                </div>
            `;
        }

        function renderRules() {
            const p = userData.program;
            const earnExample = Math.round(5000 * p.bonus_rate_default / 100);
            document.getElementById('app').innerHTML = `
                <div class="header"><div class="user-name" style="font-size:22px;">📘 Как работают мои бонусы</div></div>
                <div class="card">
                    <div class="rule-block"><span class="rule-num">1</span><b>Как я получаю бонусы?</b><br>За каждый ремонт вы получаете <b>${p.bonus_rate_default}%</b> от суммы чека.<br><br>Например: чек 5 000 ₽ → вы получаете <b>${earnExample} ₽</b> бонусов.</div>
                    <div class="rule-block"><span class="rule-num">2</span><b>Когда начисляют?</b><br>Бонусы приходят автоматически через <b>24 часа</b> после закрытия заявки.</div>
                    <div class="rule-block"><span class="rule-num">3</span><b>Сколько живут бонусы?</b><br>${p.enable_expiration ? `Каждая партия бонусов живёт <b>${p.bonus_lifetime_months} месяцев</b> с момента начисления. Затем сгорает.` : '<b>Бонусы не сгорают</b> — действуют бессрочно.'}<br><br>Мы напоминаем заранее — за 60/30/7/1 день.</div>
                    <div class="rule-block"><span class="rule-num">4</span><b>Как потратить?</b><br>Бонусами можно оплатить до <b>${p.bonus_max_spend_percent}%</b> от чека.<br><br>Порядок списания: сначала та партия, что сгорит раньше.</div>
                    <div class="rule-block"><span class="rule-num">5</span><b>Как поделиться с близкими?</b><br>${p.enable_referral ? `Приходите вместе с другом.<br>После ремонта друга:<br>• Другу — скидка на сумму подарка<br>• Начисленные бонусы делятся <b>${p.referral_split_percent}/${100-p.referral_split_percent}</b> между вами и другом` : 'Реферальная программа у мастера отключена.'}</div>
                    <div class="rule-block"><span class="rule-num">6</span><b>Дополнительные бонусы</b><br>🎂 День рождения — <b>${p.birthday_bonus} ₽</b><br>📸 Отзыв с фото — <b>${p.review_bonus} ₽</b><br>✍️ Заполнен профиль — <b>${p.profile_bonus} ₽</b></div>
                </div>
            `;
        }

        function renderOrders() {
            const orders = userData.orders;
            if (!orders.length) {
                document.getElementById('app').innerHTML = `<div class="header"><div class="user-name" style="font-size:22px;">🔧 Мои ремонты</div></div><div class="empty">Пока нет ремонтов</div>`;
                return;
            }
            const now = new Date();
            const html = orders.map(o => {
                let warrantyHtml = '';
                if (o.warranty_until) {
                    const parts = o.warranty_until.split('.');
                    const wDate = new Date(parts[2], parts[1]-1, parts[0]);
                    const active = wDate > now;
                    warrantyHtml = `<div class="warranty-badge ${active?'warranty-ok':''}">🛡 ${active?'Гарантия до ':'Гарантия истекла '}${o.warranty_until}</div>`;
                }
                return `<div class="card"><div class="order-card">
                    <div class="order-device">№${o.id} — ${o.device}</div>
                    <div class="order-works">${o.works}</div>
                    <div class="order-row"><div>${o.completed_at || ''}</div><div class="order-amount">${fmt(o.final)}</div></div>
                    ${o.discount > 0 ? `<div class="order-row" style="color:#f59e0b; font-size:12px;"><div>Скидка бонусами:</div><div>−${fmt(o.discount)}</div></div>` : ''}
                    ${warrantyHtml}
                </div></div>`;
            }).join('');
            document.getElementById('app').innerHTML = `<div class="header"><div class="user-name" style="font-size:22px;">🔧 Мои ремонты</div><div class="user-sub">Всего: ${orders.length}</div></div>${html}`;
        }

        function renderShare() {
            const balance = userData.client.bonus_balance;
            document.getElementById('app').innerHTML = `
                <div class="header"><div class="user-name" style="font-size:22px;">🎁 Поделиться бонусами</div><div class="user-sub">Пригласите друга — он получит скидку</div></div>
                <div class="card">
                    <div class="section-title">Ваш баланс: ${fmt(balance)}</div>
                    ${balance < 100 ? '<div class="empty">Минимум 100 ₽ для подарка. Скопите ещё немного бонусов!</div>' : `
                        <input type="number" class="amount-input" id="giftAmount" value="500" min="100" inputmode="numeric">
                        <div class="quick-btns">
                            <button class="quick-btn" onclick="setAmount(25)">25%</button>
                            <button class="quick-btn" onclick="setAmount(50)">50%</button>
                            <button class="quick-btn" onclick="setAmount(100)">Всё</button>
                        </div>
                        <button class="btn-gift" id="giftBtn" onclick="createInvite()">🎁 Создать приглашение</button>
                    `}
                </div>
                <div class="card">
                    <div class="section-title">📖 Как это работает</div>
                    <div class="rule-block"><b>1.</b> Вы дарите часть бонусов другу</div>
                    <div class="rule-block"><b>2.</b> Друг открывает ссылку — сразу становится вашим рефералом</div>
                    <div class="rule-block"><b>3.</b> Приходите вместе к мастеру — друг получает скидку</div>
                    <div class="rule-block"><b>4.</b> После ремонта друга бонусы делятся <b>${userData.program.referral_split_percent}/${100-userData.program.referral_split_percent}</b> между вами</div>
                </div>
            `;
        }

        function setAmount(percent) {
            const balance = userData.client.bonus_balance;
            const val = Math.round(balance * percent / 100);
            document.getElementById('giftAmount').value = val;
            showToast('Сумма: ' + fmt(val), 'info');
        }

        async function createInvite() {
            const el = document.getElementById('giftAmount');
            if (!el) { showToast('Ошибка: поле не найдено', 'error'); return; }
            const raw = String(el.value || el.textContent || '');
            const amount = parseInt(raw.replace(/[^\d]/g, ''), 10) || 0;
            const balance = userData.client.bonus_balance;

            if (amount < 100) { showToast('Минимум 100 ₽. Вы ввели: ' + amount, 'error'); return; }
            if (amount > balance) { showToast('Недостаточно бонусов. Максимум: ' + fmt(balance), 'error'); return; }

            const btn = document.getElementById('giftBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Создаём...';

            try {
                const r = await fetch(`${API}/api/client/${maxUserId}/invitation`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ amount })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || 'Ошибка сервера');

                lastInviteText = data.share_text;
                document.getElementById('inviteText').textContent = data.share_text;
                document.getElementById('inviteModal').classList.add('active');
                showToast('Приглашение на ' + fmt(amount) + ' создано!', 'success');
            } catch (err) {
                showToast('❌ ' + err.message, 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🎁 Создать приглашение';
                }
            }
        }

        async function tryNativeShare() {
            const text = lastInviteText;
            if (!text) { showToast('Нет текста для отправки', 'error'); return; }
            try {
                if (window.WebApp && typeof window.WebApp.shareContent === 'function') {
                    await window.WebApp.shareContent({ text: text });
                    return;
                }
            } catch (e) { console.warn('shareContent:', e); }
            try {
                if (navigator.share) {
                    await navigator.share({ text: text, title: 'FixBonus' });
                    return;
                }
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                console.warn('navigator.share:', e);
            }
            await copyInvite();
        }

        async function copyInvite() {
            const text = lastInviteText;
            if (!text) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    showToast('✅ Текст скопирован! Вставьте другу.', 'success');
                    return;
                }
            } catch (e) { console.warn('clipboard:', e); }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ Текст скопирован!', 'success');
            } catch (e) {
                showToast('⚠️ Не удалось скопировать. Выделите текст вручную.', 'error');
            }
        }

        function closeInviteModal() {
            document.getElementById('inviteModal').classList.remove('active');
        }

        function renderNotFound(u) {
            document.getElementById('app').innerHTML = `
                <div class="header"><div class="avatar">?</div><div class="user-name">${u.first_name || 'Гость'}</div></div>
                <div class="card" style="background:#fef3c7; border:1px solid #fcd34d; text-align:center;">
                    <h3 style="color:#92400e; margin-bottom:12px;">🔍 Вас нет в базе мастера</h3>
                    <p style="color:#92400e;">Передайте мастеру ваш MAX ID:</p>
                    <div style="font-size:28px; font-weight:700; color:#92400e; margin:16px 0; letter-spacing:2px;">${u.id}</div>
                </div>
                <button class="btn-primary" onclick="location.reload()">🔄 Обновить</button>
            `;
        }

        function showError(msg) {
            document.getElementById('app').innerHTML = `<div class="error-box">❌ ${msg}</div>`;
        }

        function fmt(v) { return Number(v||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0}) + ' ₽'; }

        window.addEventListener('load', init);
        if (document.readyState === 'complete') init();
    </script>
</body>
</html>
